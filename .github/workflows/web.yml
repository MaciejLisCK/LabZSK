name: LabZSK Web

on:
  push:
    paths: ['LabZSK.Web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['LabZSK.Web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LabZSK.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LabZSK.Web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      # GitHub Pages serves the site under https://<owner>.github.io/<repo>/
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: LabZSK.Web/dist/labzsk-web/browser

  deploy:
    # Publishes only from the default branch (master) – PR runs only build and test.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
